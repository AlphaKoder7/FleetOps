---
name: portable-checks
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: make setup
      - run: make test
      - run: make lint
# Real KVM guest operations run locally through make integration / make demo.
