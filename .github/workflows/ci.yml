name: portable-checks
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test
# Ansible lint/syntax and real local integration gates are pending their implementation.
