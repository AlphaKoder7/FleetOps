---
- name: Install HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present
- name: Validate and install HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/haproxy -c -f %s
  notify: Reload fleetops haproxy
- name: Enable and start HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: started
    enabled: true
- name: Activate pending validated load balancer changes
  ansible.builtin.meta: flush_handlers
