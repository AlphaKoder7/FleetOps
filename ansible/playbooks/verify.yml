---
- name: Verify each application directly
  hosts: application_nodes
  gather_facts: false
  tasks:
    - name: Require readiness and correct node identity
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:18081/health"
        return_content: true
      register: verify_direct
      until: verify_direct.status == 200
      retries: 20
      delay: 1
    - name: Assert direct application identity
      ansible.builtin.assert:
        that:
          - verify_direct.json.node == inventory_hostname
          - verify_direct.json.ready
    - name: Read workload service process ID
      ansible.builtin.command:
        argv: [systemctl, show, fleetops-app, --property=MainPID, --value]
      register: verify_app_pid
      changed_when: false
    - name: Read actual workload process credentials
      ansible.builtin.slurp:
        src: "/proc/{{ verify_app_pid.stdout }}/status"
      register: verify_process
      become: true
    - name: Read defined non-login workload account
      ansible.builtin.getent:
        database: passwd
        key: fleetops-app
    - name: Assert actual workload runs as the non-root managed user
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd['fleetops-app'][1] != '0'
          - >-
            ('Uid:\t' + ansible_facts.getent_passwd['fleetops-app'][1] + '\t' + ansible_facts.getent_passwd['fleetops-app'][1])
            in (verify_process.content | b64decode)
- name: Verify HAProxy distribution
  hosts: load_balancers
  gather_facts: false
  tasks:
    - name: Inspect administration socket access
      ansible.builtin.stat:
        path: /run/haproxy/fleetops-admin.sock
      register: verify_admin_socket
      become: true
    - name: Require root-owned private administration socket
      ansible.builtin.assert:
        that:
          - verify_admin_socket.stat.mode == '0600'
          - verify_admin_socket.stat.uid == 0
    - name: Sample requests through HAProxy
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:18080/"
        return_content: true
      loop: "{{ range(0, 10) | list }}"
      register: verify_balanced
    - name: Require both application identities
      ansible.builtin.assert:
        that:
          - verify_balanced.results | map(attribute='json.node') | unique | sort == groups['application_nodes'] | sort
